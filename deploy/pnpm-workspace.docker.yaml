# Docker/CI only — overrides must match pnpm-lock.yaml; native deps may build.
overrides:
  miniflare>sharp: 0.35.4

strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  workerd: true

# pnpm 11+: allow dependency build scripts in CI (explicit deny in allowBuilds still wins)
dangerouslyAllowAllBuilds: true

verifyDepsBeforeRun: false
optimisticRepeatInstall: false
